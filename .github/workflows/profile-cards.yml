name: Refresh Profile Cards

on:
  # run automatically every 12 hours, 30 minutes past the hour
  schedule:
    - cron: "30 */12 * * *"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
            ref: output

      - name: Generate stats card (Light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&bg_color=ffffff&hide_border=true&title_color=5b47de&text_color=404040&icon_color=8f81c4&border_color=63a6fc&include_all_commits=true&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate stats card (Dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&bg_color=0d1117&hide_border=true&title_color=8f81c4&text_color=ffffff&icon_color=8f81c4&border_color=63a6fc&include_all_commits=true&count_private=true
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card (Light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&bg_color=ffffff&hide_border=true&title_color=5b47de&text_color=404040&icon_color=8f81c4&border_color=63a6fc&langs_count=10
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card (Dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&bg_color=0d1117&hide_border=true&title_color=8f81c4&text_color=ffffff&icon_color=8f81c4&border_color=63a6fc&langs_count=10
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "refresh: profile cards" || exit 0
          git push origin HEAD:output
